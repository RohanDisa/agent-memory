services:
  node-a:
    build: .
    command: ["-id", "A", "-http", ":8080", "-peers", "A=node-a:8080,B=node-b:8080,C=node-c:8080", "-wal", "/data/a.wal"]
    ports:
      - "8081:8080"
    volumes:
      - a-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 1s
      timeout: 2s
      retries: 20

  node-b:
    build: .
    command: ["-id", "B", "-http", ":8080", "-peers", "A=node-a:8080,B=node-b:8080,C=node-c:8080", "-wal", "/data/b.wal"]
    ports:
      - "8082:8080"
    volumes:
      - b-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 1s
      timeout: 2s
      retries: 20

  node-c:
    build: .
    command: ["-id", "C", "-http", ":8080", "-peers", "A=node-a:8080,B=node-b:8080,C=node-c:8080", "-wal", "/data/c.wal"]
    ports:
      - "8083:8080"
    volumes:
      - c-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/health"]
      interval: 1s
      timeout: 2s
      retries: 20

volumes:
  a-data:
  b-data:
  c-data:
